version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      testes:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "jsdom"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "prettier"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
